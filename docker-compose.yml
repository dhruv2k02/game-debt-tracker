version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: game_debt_tracker
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mysecretpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    restart: always
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: "mysql://myuser:mysecretpassword@db:3306/game_debt_tracker"
    depends_on:
      - db

volumes:
  db_data:
